@switch (variant) {
  @case ('card') {
    <!-- Product Card Skeleton -->
    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
      <!-- Image placeholder -->
      <div class="aspect-square bg-gray-200 animate-shimmer"></div>

      <!-- Title lines -->
      <div class="p-5">
        <div class="h-4 bg-gray-200 rounded animate-shimmer mb-2 w-3/4"></div>
        <div class="h-4 bg-gray-200 rounded animate-shimmer w-1/2"></div>
      </div>

      <!-- Price & Button -->
      <div class="p-5 pt-0">
        <div class="h-6 bg-gray-200 rounded animate-shimmer w-1/3 mb-4"></div>
        <div class="w-full h-12 bg-gray-200 rounded-2xl animate-shimmer"></div>
      </div>
    </div>
  }

  @case ('row') {
    <!-- Order Table Row Skeleton -->
    <div class="flex items-center gap-4 bg-white rounded-2xl p-5 shadow-sm">
      <!-- Order ID -->
      <div class="h-4 bg-gray-200 rounded animate-shimmer w-20"></div>
      <!-- Date -->
      <div class="h-4 bg-gray-200 rounded animate-shimmer w-32"></div>
      <!-- Status badge -->
      <div class="h-6 bg-gray-200 rounded-full animate-shimmer w-20"></div>
      <!-- Total amount -->
      <div class="h-4 bg-gray-200 rounded animate-shimmer w-16"></div>
      <!-- Action button -->
      <div class="h-8 bg-gray-200 rounded animate-shimmer w-20 ml-auto"></div>
    </div>
  }

  @case ('text') {
    <div class="animate-shimmer rounded" [style.width]="width" [style.height]="height"></div>
  }

  @case ('circle') {
    <div class="animate-shimmer rounded-full" [style.width]="width" [style.height]="height"></div>
  }

  @case ('rect') {
    <div class="animate-shimmer rounded-lg" [style.width]="width" [style.height]="height"></div>
  }
}
