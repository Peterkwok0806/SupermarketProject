<div
  class="relative w-full h-[280px] md:h-[400px] lg:h-[480px] overflow-hidden rounded-3xl shadow-lg"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()">

  <!-- Slides -->
  @for (slide of slides; track slide.image; let i = $index) {
    <div
      class="absolute inset-0 transition-all duration-700 ease-in-out"
      [class.opacity-100]="currentSlide() === i"
      [class.opacity-0]="currentSlide() !== i"
      [class.scale-100]="currentSlide() === i"
      [class.scale-105]="currentSlide() !== i"
      [class.pointer-events-none]="currentSlide() !== i">
      <img
        [src]="slide.image"
        [alt]="slide.alt"
        class="w-full h-full object-cover"
      />
    </div>
  }

  <!-- Gradient Overlay -->
  <div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent pointer-events-none"></div>

  <!-- Previous Button -->
  <button
    (click)="prevSlide()"
    class="absolute left-4 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-gray-800 w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center shadow-lg transition-all hover:scale-110 z-10">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
    </svg>
  </button>

  <!-- Next Button -->
  <button
    (click)="nextSlide()"
    class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-gray-800 w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center shadow-lg transition-all hover:scale-110 z-10">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
    </svg>
  </button>

  <!-- Dots Indicator -->
  <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-2 z-10">
    @for (slide of slides; track slide.image; let i = $index) {
      <span
        role="button"
        (click)="goToSlide(i)"
        [class]="currentSlide() === i ? 'block w-8 bg-white h-3 rounded-full transition-all duration-300 hover:bg-white/80' : 'block w-3 bg-white/50 h-3 rounded-full transition-all duration-300 hover:bg-white/80'">
      </span>
    }
  </div>
</div>
